name: run main.py

on:
  schedule:
    - cron: '30 * 26 4 *'
  workflow_dispatch:

jobs:
  build:
      runs-on: ubuntu-latest
      steps:

        - name: checkout repo content
          uses: actions/checkout@v2
          with:
            token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} 

        - name: setup python
          uses: actions/setup-python@v4
          with:
            python-version: '3.10'

        - name: execute py script
          run: python main.py

        - name: commit files
          run: |
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add -A
            git diff-index --quiet HEAD || (git commit -a -m "update numbers" --allow-empty)

        - name: push changes
          run: git push

