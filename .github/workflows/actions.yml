name: run main.py

on:
  schedule:
    - cron: '5 * * 4 *'
  workflow_dispatch:

jobs:
  build:
      runs-on: ubuntu-latest
      steps:

        - name: checkout repo content
          uses: actions/checkout@v2

        - name: setup python
          uses: actions/setup-python@v4
          with:
            python-version: '3.10'

        - name: execute py script
          run: python main.py